# Publish prebuilt scan-agent binaries as GitHub Release assets, so operators can
# run the agent without Docker and without a Go toolchain. On a v* tag, the agent
# is cross-compiled for common OS/arch pairs and each binary is attached to that
# tag's release as:
#   portwiz-agent_<tag>_<os>_<arch>[.exe]
name: agent-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        working-directory: apps/agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="portwiz-agent_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/agent
          echo "ASSET=apps/agent/$out" >> "$GITHUB_ENV"

      - name: Attach binary to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
