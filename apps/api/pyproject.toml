[project]
name = "portwiz-api"
version = "0.1.0"
description = "PortWiz control plane: API, scheduling, change detection, audit, evidence."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.4",
    "httpx>=0.27",
    "email-validator>=2.2",
    "reportlab>=4.2",
    "aiosmtplib>=3.0",
    "croniter>=2.0",
    "openpyxl>=3.1",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portwiz_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Query() defaults are the framework idiom.
# UP017: datetime.timezone.utc is kept for clarity over the datetime.UTC alias.
# UP042: keep explicit (str, enum.Enum) — StrEnum changes str(member) semantics.
ignore = ["B008", "UP017", "UP042"]
